spring.application.name=url-shortener-sb

# ==========================
# Server
# ==========================
server.port=${PORT:8080}

# ==========================
# Database
# ==========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/urlshortenerdb}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ==========================
# HikariCP Connection Pool
# ==========================
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.keepalive-time=${HIKARI_KEEPALIVE_MS:60000}
spring.datasource.hikari.pool-name=LinkFlowPool

# ==========================
# JPA / Hibernate
# ==========================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

# ==========================
# JWT
# ==========================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:172800000}

# ==========================
# CORS
# ==========================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ==========================
# Actuator
# ==========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=LinkFlow
info.app.description=URL Shortening and Analytics Platform

# ==========================
# Logging
# ==========================
logging.level.root=${ROOT_LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:INFO}
logging.level.com.urlshortener=${APP_LOG_LEVEL:INFO}
