# ==========================
# Production Profile
# Activated via: SPRING_PROFILES_ACTIVE=prod
# All secrets must be supplied as environment variables.
# No default values are provided here for sensitive properties.
# ==========================

# ==========================
# HikariCP — Production Sizing
# ==========================
# Override these via HIKARI_* env vars if the container/instance warrants it.
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}

# ==========================
# JPA — Production Safety
# ==========================
# 'validate' ensures the schema matches the entities; never 'update' in prod.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================
# Actuator — Production Exposure
# ==========================
# Expose only health and info; never expose env, beans, or mappings in prod.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ==========================
# Logging — Production Levels
# ==========================
logging.level.root=${ROOT_LOG_LEVEL:WARN}
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:WARN}
logging.level.com.urlshortener=${APP_LOG_LEVEL:INFO}
# Structured console output for log aggregators (Datadog, CloudWatch, etc.)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
